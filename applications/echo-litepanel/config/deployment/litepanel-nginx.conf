limit_req_zone $binary_remote_addr zone=litepanel_login:10m rate=6r/m;

server {
    listen 80 default_server;
    server_name 81.70.31.79;
    location ^~ /.well-known/acme-challenge/ { root /var/www/echo-acme; }
    location / { return 302 https://81.70.31.79$request_uri; }
}
server {
    listen 443 ssl;
    server_name 81.70.31.79;
    ssl_certificate /etc/letsencrypt/live/81.70.31.79/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/81.70.31.79/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self)" always;
    location = /mqtt {
        proxy_pass http://127.0.0.1:9004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /api/login {
        limit_req zone=litepanel_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.2:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.2:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
