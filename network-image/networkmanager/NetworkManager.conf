[main]
plugins=keyfile
dhcp=internal
dns=default
rc-manager=file
auth-polkit=false
hostname-mode=none
no-auto-default=*

[device]
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
wifi.powersave=2

[keyfile]
unmanaged-devices=interface-name:usb0

[connectivity]
enabled=false
